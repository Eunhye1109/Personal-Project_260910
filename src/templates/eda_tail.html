<div id="tip" role="status" aria-live="polite"></div>

<script>
const SVGNS="http://www.w3.org/2000/svg";
const el=(n,a={})=>{const e=document.createElementNS(SVGNS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=n=>n.toLocaleString("ko-KR");

/* ── data ── */
{{DATA}}

/* ── tooltip ── */
const tip=document.getElementById("tip");
function bindTip(node,text){
  node.setAttribute("data-tip",text); node.setAttribute("tabindex","0");
  const show=e=>{tip.textContent=text;tip.style.opacity="1";
    const r=node.getBoundingClientRect();
    tip.style.left=Math.min(window.innerWidth-240,(e.clientX||r.left)+12)+"px";
    tip.style.top=((e.clientY||r.top)-14)+"px";};
  node.addEventListener("mousemove",show); node.addEventListener("focus",show);
  node.addEventListener("mouseleave",()=>tip.style.opacity="0");
  node.addEventListener("blur",()=>tip.style.opacity="0");
}

/* ── 1. year composition ── */
(function(){
  const lg=document.getElementById("lg-grade");
  GRADES.forEach((g,i)=>{const s=document.createElement("span");
    s.innerHTML=`<i class="sw" style="background:var(${RAMP[i]})"></i>${g}`;lg.appendChild(s);});

  const svg=document.getElementById("c-year"),L=112,R=52,W=900-L-R,H=28,GAP=3;
  YEAR.forEach(([y,n,p],r)=>{
    const yy=8+r*(H+GAP);
    const t=el("text",{x:0,y:yy+18,class:"rowlab"}); t.textContent=y; svg.appendChild(t);
    const c=el("text",{x:L-10,y:yy+18,class:"axis","text-anchor":"end"}); c.textContent=fmt(n); svg.appendChild(c);
    let x=L;
    p.forEach((v,i)=>{
      if(v<=0)return;
      const w=W*v/100;
      const rect=el("rect",{x:x,y:yy,width:Math.max(w-2,1),height:H,rx:2,fill:`var(${RAMP[i]})`});
      bindTip(rect,`${y} · ${GRADES[i]}  ${v}% (약 ${fmt(Math.round(n*v/100))}건)`);
      svg.appendChild(rect);
      if(v>=12){const lb=el("text",{x:x+6,y:yy+18,class:"vlab",fill:i>=3?"var(--paper)":"var(--ink)"});
        lb.textContent=v.toFixed(0)+"%";svg.appendChild(lb);}
      x+=w;
    });
  });
  const tb=document.getElementById("t-year");
  tb.innerHTML=`<thead><tr><th>연도</th><th>건수</th>${GRADES.map(g=>`<th>${g}</th>`).join("")}</tr></thead>`
   +`<tbody>${YEAR.map(([y,n,p])=>`<tr><td>${y}</td><td>${fmt(n)}</td>${p.map(v=>`<td>${v.toFixed(1)}%</td>`).join("")}</tr>`).join("")}</tbody>`;
})();

/* ── 2. grade & kind ── */
function hbars(id,rows,colorFn,total,labelW){
  const svg=document.getElementById(id),L=labelW,R=86,W=900-L-R,H=26,GAP=8;
  const max=Math.max(...rows.map(r=>r[1]));
  rows.forEach(([name,n],i)=>{
    const y=8+i*(H+GAP);
    const t=el("text",{x:0,y:y+18,class:"rowlab"});t.textContent=name;svg.appendChild(t);
    const w=Math.max(W*n/max,2);
    const rect=el("rect",{x:L,y:y,width:w,height:H,rx:2,fill:colorFn(i)});
    bindTip(rect,`${name}  ${fmt(n)}건 · ${(n/total*100).toFixed(1)}%`);
    svg.appendChild(rect);
    const v=el("text",{x:L+w+9,y:y+18,class:"vlab"});
    v.textContent=`${fmt(n)}  ${(n/total*100).toFixed(1)}%`;svg.appendChild(v);
  });
}
hbars("c-grade",GRADES.map((g,i)=>[g,GRADE_N[i]]),i=>`var(${RAMP[i]})`,TOTAL,120);
hbars("c-kind",KIND,()=> "var(--plain)",TOTAL,100);

/* ── 3. notation ── */
(function(){
  const svg=document.getElementById("c-nota"),L=104,B=44,W=900-L-40,H=300-B-16;
  const max=4, band=W/7;
  [1,2,3,4].forEach(v=>{
    const y=16+H-H*v/max;
    svg.appendChild(el("line",{x1:L,x2:L+W,y1:y,y2:y,stroke:"var(--line)","stroke-width":1}));
    const t=el("text",{x:L-10,y:y+4,class:"axis","text-anchor":"end"});t.textContent=v;svg.appendChild(t);
  });
  NOTA.forEach((pair,i)=>{
    pair.forEach((v,k)=>{
      const bw=band*0.30, x=L+band*i+band*0.16+k*(bw+4), h=H*v/max, y=16+H-h;
      const rect=el("rect",{x:x,y:y,width:bw,height:h,rx:2,fill:k?"var(--catB)":"var(--catA)"});
      bindTip(rect,`${ITEMS[i]} (rtStdName${i+1}) · ${k?"등급표기":"단계표기"}  평균 ${v.toFixed(2)}`);
      svg.appendChild(rect);
      const lb=el("text",{x:x+bw/2,y:y-6,class:"vlab","text-anchor":"middle"});
      lb.textContent=v.toFixed(2);svg.appendChild(lb);
    });
    const t=el("text",{x:L+band*i+band/2,y:16+H+22,class:"axis","text-anchor":"middle"});
    t.textContent=ITEMS[i];svg.appendChild(t);
  });
  const yl=el("text",{x:L-10,y:16+H+22,class:"axis","text-anchor":"end"});yl.textContent="평균";svg.appendChild(yl);
  document.getElementById("t-nota").innerHTML=
    `<thead><tr><th>항목</th><th>단계표기</th><th>등급표기</th><th>차이</th></tr></thead><tbody>`
    +NOTA.map((p,i)=>`<tr><td>${ITEMS[i]} <span class="mono">rtStdName${i+1}</span></td><td>${p[0].toFixed(2)}</td><td>${p[1].toFixed(2)}</td><td>${(p[1]-p[0]).toFixed(2)}</td></tr>`).join("")
    +`</tbody>`;
})();

/* ── 4. profile heatmap ── */
(function(){
  const svg=document.getElementById("c-prof"),L=130,T=34,CW=95,CH=42,GAP=3;
  for(let c=0;c<7;c++){
    const t=el("text",{x:L+c*CW+CW/2,y:T-12,class:"axis","text-anchor":"middle"});
    t.textContent=ITEMS[c];svg.appendChild(t);
  }
  PROF.forEach((row,r)=>{
    const t=el("text",{x:0,y:T+r*CH+CH/2+4,class:"rowlab"});t.textContent=GRADES[r];svg.appendChild(t);
    row.forEach((v,c)=>{
      const step=Math.min(4,Math.max(0,Math.round(v)-1));
      const rect=el("rect",{x:L+c*CW,y:T+r*CH,width:CW-GAP,height:CH-GAP,rx:2,fill:`var(${RAMP[step]})`});
      bindTip(rect,`${GRADES[r]} · ${ITEMS[c]}  평균 ${v.toFixed(2)}단계`);
      svg.appendChild(rect);
      const tx=el("text",{x:L+c*CW+(CW-GAP)/2,y:T+r*CH+CH/2+4,class:"vlab","text-anchor":"middle",
        fill:step>=3?"var(--paper)":"var(--ink)"});
      tx.textContent=v.toFixed(2);svg.appendChild(tx);
    });
  });
})();

/* ── 6. adjustment ── */
(function(){
  const svg=document.getElementById("c-adj"),L=0,W=900,H=34;
  const colors=["var(--dvMid)","var(--dvPos)","var(--dvNeg)"];
  let x=0;
  ADJ.forEach(([name,n,pct],i)=>{
    const w=W*pct/100;
    const rect=el("rect",{x:x,y:26,width:Math.max(w-2,1),height:H,rx:2,fill:colors[i]});
    bindTip(rect,`${name}  ${fmt(n)}건 · ${pct}%`);
    svg.appendChild(rect);
    const t=el("text",{x:x,y:18,class:"vlab"});
    t.textContent=`${name} ${pct}%`;svg.appendChild(t);
    const c=el("text",{x:x,y:82,class:"axis"});c.textContent=fmt(n)+"건";svg.appendChild(c);
    x+=w;
  });
  hbars("c-adjup",ADJUP,()=> "var(--dvPos)",ADJUP.reduce((a,b)=>a+b[1],0),130);
})();

/* ── 7. correlation ── */
(function(){
  const svg=document.getElementById("c-corr"),L=118,T=40,C=92,GAP=3;
  const mix=v=>{
    if(v>=0) return {fill:"var(--dvPos)",op:Math.max(.10,Math.abs(v))};
    return {fill:"var(--dvNeg)",op:Math.max(.10,Math.abs(v))};
  };
  for(let i=0;i<7;i++){
    const th=el("text",{x:L+i*C+C/2,y:T-12,class:"axis","text-anchor":"middle"});th.textContent=ITEMS[i];svg.appendChild(th);
    const tl=el("text",{x:L-12,y:T+i*C+C/2+4,class:"rowlab","text-anchor":"end"});tl.textContent=ITEMS[i];svg.appendChild(tl);
  }
  CORR.forEach((row,r)=>row.forEach((v,c)=>{
    const bg=el("rect",{x:L+c*C,y:T+r*C,width:C-GAP,height:C-GAP,rx:2,fill:"var(--dvMid)"});
    svg.appendChild(bg);
    const m=mix(v);
    const rect=el("rect",{x:L+c*C,y:T+r*C,width:C-GAP,height:C-GAP,rx:2,fill:m.fill,"fill-opacity":m.op});
    bindTip(rect,`${ITEMS[r]} ↔ ${ITEMS[c]}  상관 ${v.toFixed(2)}`);
    svg.appendChild(rect);
    const t=el("text",{x:L+c*C+(C-GAP)/2,y:T+r*C+C/2+3,class:"vlab","text-anchor":"middle",
      "font-size":"10.5"});
    t.textContent=v.toFixed(2);svg.appendChild(t);
  }));
  const note=el("text",{x:L,y:T+7*C+26,class:"axis"});
  note.textContent="주제·선정성·대사·모방위험 덩어리와 폭력성·공포·약물 덩어리로 갈린다";svg.appendChild(note);
})();

/* ── 8. 최고값 x 등급 (항등식) ── */
(function(){
  const svg=document.getElementById("c-rule"); if(!svg) return;
  const L=90,T=44,CW=150,CH=40,GAP=3;
  GRADES.forEach((g,c)=>{
    const t=el("text",{x:L+c*CW+CW/2,y:T-14,class:"axis","text-anchor":"middle"});
    t.textContent=g.replace("이상관람가","세").replace("관람가","");svg.appendChild(t);
  });
  RULE.forEach(([lv,tot,...cells],r)=>{
    const t=el("text",{x:0,y:T+r*CH+CH/2+4,class:"rowlab"});t.textContent=lv+"단계";svg.appendChild(t);
    cells.forEach((n,c)=>{
      const on=n>0, w=CW-GAP;
      const rect=el("rect",{x:L+c*CW,y:T+r*CH,width:w,height:CH-GAP,rx:2,
        fill:on?"var(--s4)":"var(--sunk)"});
      bindTip(rect,`최고값 ${lv}단계 → ${GRADES[c]}  ${fmt(n)}건`);
      svg.appendChild(rect);
      if(n>0){
        const tx=el("text",{x:L+c*CW+w/2,y:T+r*CH+CH/2+4,class:"vlab","text-anchor":"middle",
          fill:"var(--paper)"});
        tx.textContent=fmt(n);svg.appendChild(tx);
      }
    });
  });
  const note=el("text",{x:L,y:T+RULE.length*CH+24,class:"axis"});
  note.textContent="대각선만 채워진다 — 관람등급은 내용정보의 최고값과 같다";
  svg.appendChild(note);
})();

/* ── 9. 종별로 등급을 결정한 항목 ── */
(function(){
  const svg=document.getElementById("c-heat"); if(!svg) return;
  const L=110,T=40,CW=Math.min(105,(900-L)/REASONS.length),CH=36,GAP=3;
  REASONS.forEach((n,c)=>{
    const t=el("text",{x:L+c*CW+CW/2,y:T-12,class:"axis","text-anchor":"middle"});
    t.textContent=n;svg.appendChild(t);
  });
  HEAT.forEach(([kind,...vals],r)=>{
    const t=el("text",{x:0,y:T+r*CH+CH/2+4,class:"rowlab"});t.textContent=kind;svg.appendChild(t);
    vals.forEach((v,c)=>{
      const step=Math.min(4,Math.floor(v/20));
      const rect=el("rect",{x:L+c*CW,y:T+r*CH,width:CW-GAP,height:CH-GAP,rx:2,
        fill:`var(${RAMP[step]})`});
      bindTip(rect,`${kind} · ${REASONS[c]}  ${v}%`);
      svg.appendChild(rect);
      const tx=el("text",{x:L+c*CW+(CW-GAP)/2,y:T+r*CH+CH/2+4,class:"vlab","text-anchor":"middle",
        fill:step>=3?"var(--paper)":"var(--ink)"});
      tx.textContent=v.toFixed(0)+"%";svg.appendChild(tx);
    });
  });
  const note=el("text",{x:L,y:T+HEAT.length*CH+24,class:"axis"});
  note.textContent="각 종별에서 그 항목이 결정사유로 지목된 비율";
  svg.appendChild(note);
})();

</script>
